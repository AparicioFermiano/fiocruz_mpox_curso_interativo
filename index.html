<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Aparicio Fermiano dos Santos Junior">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/style.min.css">
    <link rel="stylesheet" href="./css/sidenav.min.css">
    <link rel="stylesheet" href="./css/animacao.css">
    <!-- https://github.com/AparicioFermiano -->
    <title>Módulo 01</title>
</head>

<body>
    <div class="offcanvas"></div>
    <!-- SIDEBAR -->
    <button type="button" class="btn-sidebar" aria-expanded="false" aria-label="Botão - Menu lateral" onclick="nav()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="sidebar">
        <div>
            <img src="./image/logo_sidebar.png" alt="Logo Monkeypox" class="d-block mx-auto w-50 mb-3">
            <!-- SIDEBAR - HOME -->
            <div class="sidebar-item active">
                <a href="#" class="d-flex">
                    <div class="sidebar-item-icon">
                        <i class="bi bi-house"></i>
                    </div>
                    <div class="sidebar-item-title">
                        Início
                    </div>
                </a>
            </div>
            <div class="sidebar-item">
                <a href="#sobre" class="d-flex">
                    <div class="sidebar-item-icon">
                        <i class="bi bi-exclamation-diamond"></i>
                    </div>
                    <div class="sidebar-item-title">
                        Sobre o módulo
                    </div>
                </a>
            </div>
            <div class="sidebar-item">
                <a href="#definicao" class="d-flex">
                    <div class="sidebar-item-icon font-oswald text-center">
                        <b>01</b>
                    </div>
                    <div class="sidebar-item-title">
                        Definição da doença e formas de transmissão
                    </div>
                </a>
            </div>
        </div>
        <!-- BOTOES CARROSEL -->
        <div class="d-flex justify-content-around px-4">
            <button type="button" class="btn-sidebar-icon" onclick="carouselHandler('prev', 'carousel1')">
                <i class="bi bi-door-open"></i>
            </button>
            <button type="button" class="btn-sidebar-icon" onclick="carouselHandler('next', 'carousel1')">
                <i class="bi bi-person-badge"></i>
            </button>
            <button type="button" class="btn-sidebar-icon" onclick="carouselHandler('next', 'carousel1')">
                <i class="bi bi-exclamation-circle"></i>
            </button>
        </div>
    </div>

    <div id="capa" class="container-fluid">
        <div class="row pt-mobile-5">
            <div class="col-12 col-lg-6 padding-x-container pt-5">
                <div class="d-flex justify-content-center mb-5">
                    <img src="./image/logo_fiocruz.png" alt="" class="mx-2">
                    <img src="./image/logo_nova_una_sus.png" alt="" class="mx-2">
                </div>
                <div>
                    <span class="modulo-capa digitando">MONKEYPOX</span><br>
                    <span class="titulo bold secondary-dark">MÓDULO 01</span>
                    <p class="mt-5 mb-2 titulo">Introdução ao MPOX / Monkeypox / Varíola dos macacos / Varíola símia</p>
                </div>
                <div class="row">
                    <div class="col-12 col-md-3 col-lg-3 capitulo-capa secondary-dark">01</div>
                    <div class="col-12 col-md-9 col-lg-6 m-auto w-lg-50">
                        <div class="w-100 d-flex justify-content-between mb-3">
                            <button class="button btn-col-2 btn-secondary">Créditos</button>
                            <button class="button btn-col-2">Instruções</button>
                        </div>
                        <button class="button w-100 btn-outline">Iniciar</button>
                    </div>
                </div>
            </div>
    
            <div class="col-12 col-lg-6 d-flex align-items-center pt-mobile-5">
                <div class="position-relative w-100 pt-mobile-5">
                    <img src="./image/logo_mpox_capa.svg" alt="Logo MPOX" class="mx-auto w-100">
                    <div class="position-absolute detalhe-1">
                        <img src="./image/capa_detalhes_1.svg" alt="Detalhes" class="img-animacao move-up-down">
                    </div>
                    <div class="position-absolute detalhe-2">
                        <img src="./image/capa_detalhes_2.svg" alt="Detalhes" class="img-animacao move-x">
                    </div>
                    <div class="position-absolute detalhe-3">
                        <img src="./image/capa_detalhes_3.svg" alt="Detalhes" class="img-animacao move-zoom">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/index.min.js"></script>
    <!-- https://github.com/AparicioFermiano -->
</body>

</html>
